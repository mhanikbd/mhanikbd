<svg xmlns="http://www.w3.org/2000/svg" width="240" height="56" viewBox="0 0 240 56" role="img" aria-labelledby="title desc">
<title id="title">Visit my website</title>
<desc id="desc">Button: Visit my website</desc>
<defs>
<style>

.d{font-family:'Sora','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.s{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif}
.m{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace}
.t1{fill:#0B1324}.t2{fill:#44536A}.t3{fill:#6B7890}.gd{fill:#B7791F}.ac{fill:#0284C7}
.fx{transform-box:fill-box;transform-origin:center}
.up{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
.blink{animation:blink 1.05s step-end infinite}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes ping{0%{opacity:.85;transform:scale(1)}70%,100%{opacity:0;transform:scale(2.8)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes glow{0%,100%{opacity:0}8%{opacity:.9}24%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.sh{animation:shine 6s ease-in-out infinite}@keyframes shine{0%{transform:translateX(0)}35%,100%{transform:translateX(360px)}}
</style>
<linearGradient id="gA" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0D9488"/><stop offset=".55" stop-color="#0284C7"/><stop offset="1" stop-color="#4F46E5"/></linearGradient>
<linearGradient id="gV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D9488"/><stop offset=".55" stop-color="#0284C7"/><stop offset="1" stop-color="#4F46E5"/></linearGradient>
<linearGradient id="gD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D9488"/><stop offset=".5" stop-color="#0284C7"/><stop offset="1" stop-color="#4F46E5"/></linearGradient>
<linearGradient id="streak" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0284C7" stop-opacity="0"/><stop offset=".5" stop-color="#0284C7" stop-opacity=".95"/><stop offset="1" stop-color="#0284C7" stop-opacity="0"/></linearGradient>
<radialGradient id="au1"><stop offset="0" stop-color="#5EEAD4" stop-opacity="0.50"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient>
<radialGradient id="au2"><stop offset="0" stop-color="#A5B4FC" stop-opacity="0.50"/><stop offset="1" stop-color="#A5B4FC" stop-opacity="0"/></radialGradient>
<radialGradient id="au3"><stop offset="0" stop-color="#7DD3FC" stop-opacity="0.50"/><stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#D9E1EC"/></pattern>
<clipPath id="bc"><rect x="1" y="1" width="238" height="54" rx="27"/></clipPath>
<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0284C7" stop-opacity="0"/><stop offset=".5" stop-color="#0284C7" stop-opacity=".16"/><stop offset="1" stop-color="#0284C7" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="238" height="54" rx="27" fill="#FFFFFF"/>
<rect x="1" y="1" width="238" height="54" rx="27" fill="url(#gA)" opacity=".07"/>
<g clip-path="url(#bc)"><g class="sh"><rect x="-90" y="0" width="70" height="56" fill="url(#shg)" transform="skewX(-20)"/></g></g>
<rect x="1" y="1" width="238" height="54" rx="27" fill="none" stroke="url(#gA)" stroke-width="1.5"/>
<text x="108" y="33.5" text-anchor="middle" class="s t1" font-size="15" font-weight="600">Visit my website</text>
<g transform='translate(186 17) scale(0.78)' fill='none' stroke='#0284C7' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M8 20 L20 8 M10.5 8 H20 V17.5'/></g>
