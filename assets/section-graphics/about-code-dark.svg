<title id="title">About me as a code object</title>
<desc id="desc">A code editor card describing Mehedi Hasan Anik: role Product &amp; Project Leader, based in Dhaka, Bangladesh, company naztech Inc, working since 2018, domains FinTech, Banking, AI, approach idea → technology → impact.</desc>
<defs>
<style>

.d{font-family:'Sora','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
