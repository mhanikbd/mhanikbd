<svg xmlns="http://www.w3.org/2000/svg" width="880" height="160" viewBox="0 0 880 160" role="img" aria-labelledby="title desc">
<title id="title">Contribution animation placeholder</title>
<desc id="desc">Placeholder until the GitHub Actions workflow generates the contribution animation.</desc>
<defs>
<style>

.d{font-family:'Sora','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.s{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif}
.m{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace}
.t1{fill:#F1F5F9}.t2{fill:#A9B5C8}.t3{fill:#71809A}.gd{fill:#F5B841}.ac{fill:#38BDF8}
.fx{transform-box:fill-box;transform-origin:center}
.up{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
.blink{animation:blink 1.05s step-end infinite}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes ping{0%{opacity:.85;transform:scale(1)}70%,100%{opacity:0;transform:scale(2.8)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes glow{0%,100%{opacity:0}8%{opacity:.9}24%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

</style>
<linearGradient id="gA" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset=".55" stop-color="#38BDF8"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
<linearGradient id="gV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset=".55" stop-color="#38BDF8"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
<linearGradient id="gD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
<linearGradient id="streak" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38BDF8" stop-opacity="0"/><stop offset=".5" stop-color="#38BDF8" stop-opacity=".95"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></linearGradient>
<radialGradient id="au1"><stop offset="0" stop-color="#0EA5A4" stop-opacity="0.42"/><stop offset="1" stop-color="#0EA5A4" stop-opacity="0"/></radialGradient>
<radialGradient id="au2"><stop offset="0" stop-color="#6366F1" stop-opacity="0.42"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
<radialGradient id="au3"><stop offset="0" stop-color="#0284C7" stop-opacity="0.42"/><stop offset="1" stop-color="#0284C7" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1A2542"/></pattern>

</defs>
<rect x=".5" y=".5" width="879" height="159" rx="18" fill="#0B1222" stroke="#1B2640" stroke-dasharray="4 6"/>
<text x="440" y="76" text-anchor="middle" class="m t3" font-size="12" letter-spacing="2">CONTRIBUTION ANIMATION</text>
<text x="440" y="100" text-anchor="middle" class="s t3" font-size="13">Appears after the first run of the Profile assets workflow</text>
</svg>